version: 2

project_name: flywheel

before:
  hooks:
    - go mod tidy

# On macOS the bluetooth package binds CoreBluetooth through cgo, so the
# release runs on a macOS runner, whose clang builds both architectures.
# On Linux it talks to BlueZ over D-Bus in pure Go, so no cgo is needed.
builds:
  - id: flywheel-darwin
    main: ./cmd/flywheel
    binary: flywheel
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
  - id: flywheel-linux
    main: ./cmd/flywheel
    binary: flywheel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: flywheel
    ids:
      - flywheel-darwin
      - flywheel-linux
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs'
      - '^chore'
      - '^test'
      - '^ci'
      - Merge pull request
      - Merge branch

brews:
  - name: flywheel
    ids:
      - flywheel
    repository:
      owner: Josef-Hlink
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Josef-Hlink/flywheel
    description: Control a Bluetooth smart trainer (FTMS) from the terminal
    license: MIT
    install: |
      bin.install "flywheel"
    test: |
      system "#{bin}/flywheel", "--version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(formula): bump {{ .ProjectName }} to {{ .Tag }}"

nix:
  - name: flywheel
    ids:
      - flywheel
    repository:
      owner: Josef-Hlink
      name: nur-packages
      branch: main
      token: "{{ .Env.NIX_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Josef-Hlink/flywheel
    description: Control a Bluetooth smart trainer (FTMS) from the terminal
    license: mit
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(nix): bump {{ .ProjectName }} to {{ .Tag }}"
